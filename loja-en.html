      font-size: 17px;

    }
    a {
      color: #f5f5f5;
    }
    .nav-link {
      transition: opacity 0.2s ease;
    }
    .nav-link:hover {
      opacity: 0.6;
      background-color: transparent !important;
      color: #f5f5f5 !important;
    }

    /* Hero video container - Sepultura style */
    .video-hero {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .video-hero video {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* Video overlay gradient */
    .video-hero::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100px;
      background: linear-gradient(to top, rgba(18, 18, 18, 0.8), transparent);
      pointer-events: none;
    }

    /* Responsive video */
    @media (max-width: 600px) {
      .video-hero {
        border-radius: 0;
        max-width: 100%;
      }
    }
  </style>

function toggleNav() {
  const nav = document.getElementById("navDemo");

  button.setAttribute("aria-expanded", isExpanded);
}
