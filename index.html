    /* EP Carousel */
    .ep-carousel {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 12px;
    }

    .ep-carousel-track {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .ep-carousel-slide {
      min-width: 100%;
      box-sizing: border-box;
    }

    .ep-carousel-slide img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: 2px solid #ddd;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .ep-carousel-slide img:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
    }

    .ep-carousel-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      padding: 16px 12px;
      cursor: pointer;
      font-size: 18px;
      z-index: 5;
      border-radius: 4px;
      transition: background 0.3s ease;
    }

    .ep-carousel-nav:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .ep-carousel-nav.prev {
      left: 10px;
    }

    .ep-carousel-nav.next {
      right: 10px;
    }

    .ep-carousel-dots {
      text-align: center;
      margin-top: 16px;
    }

    .ep-carousel-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin: 0 6px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .ep-carousel-dot.active {
      background: #fff;
    }

    .ep-carousel-title {
      text-align: center;
      margin-top: 16px;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      .ep-carousel {
        max-width: 90%;
      }

        padding: 12px 8px;
        font-size: 14px;
      }

<script>
function toggleNav() {
  const nav = document.getElementById("navDemo");
  const button = document.querySelector("[aria-controls='navDemo']");
  const isExpanded = nav.classList.toggle("w3-show");
  button.setAttribute("aria-expanded", isExpanded);
}

// EP Carousel
let currentSlide = 0;
const epTitles = [
  { text: 'ESCUTE O EP THIS IS NOT CATEQUESE', link: 'https://open.spotify.com/album/2tlqrFudDE1mjIurt43DaO?si=mYyB3otETry2ACk5BSXGHQ' },
  { text: 'ESCUTE O EP RESILIENTE', link: 'https://onerpm.link/623153449389' }
];

function updateCarousel() {
  const track = document.getElementById('epCarouselTrack');
  const dots = document.querySelectorAll('.ep-carousel-dot');
  const titleEl = document.getElementById('epCarouselTitle');
  
  if (track) {
    track.style.transform = `translateX(-${currentSlide * 100}%)`;
  }
  
  dots.forEach((dot, index) => {
    dot.classList.toggle('active', index === currentSlide);
  });
  
  if (titleEl && epTitles[currentSlide]) {
    titleEl.innerHTML = `<a href="${epTitles[currentSlide].link}" target="_blank" rel="noopener noreferrer" class="text-link">${epTitles[currentSlide].text}</a>`;
  }
}

function moveCarousel(direction) {
  currentSlide += direction;
  if (currentSlide < 0) currentSlide = 1;
  if (currentSlide > 1) currentSlide = 0;
  updateCarousel();
}

function goToSlide(index) {
  currentSlide = index;
  updateCarousel();
}

// Auto-advance carousel every 5 seconds
setInterval(() => {
  currentSlide = (currentSlide + 1) % 2;
  updateCarousel();
}, 5000);
</script>
